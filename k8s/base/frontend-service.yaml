# Frontend Service
#
# Learning points:
# - ClusterIP for internal routing via Ingress
# - LoadBalancer would expose directly (more expensive, less flexible)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pnl-demo
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: frontend
