# Backend Service
#
# Learning points:
# - Service types: ClusterIP (internal), NodePort, LoadBalancer, ExternalName
# - Services provide load balancing across pod replicas
# - DNS: backend.pnl-demo.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pnl-demo
  labels:
    app: backend
spec:
  type: ClusterIP  # Internal service, exposed via Ingress
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: backend
---
# Horizontal Pod Autoscaler
#
# Learning points:
# - HPA automatically scales pods based on metrics
# - Requires metrics-server in cluster
# - Can scale on CPU, memory, or custom metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: pnl-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
