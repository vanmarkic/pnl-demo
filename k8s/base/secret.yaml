# Secret - Sensitive configuration data
#
# Learning points:
# - Secrets store sensitive data (passwords, API keys, certificates)
# - Values are base64 encoded (NOT encrypted by default!)
# - In production, use external secret management (AWS Secrets Manager, Vault)
# - Never commit real secrets to git - this is a template
#
# To encode a value: echo -n 'mypassword' | base64
# To decode: echo 'bXlwYXNzd29yZA==' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: pnl-secrets
  namespace: pnl-demo
type: Opaque
data:
  # PostgreSQL credentials (base64 encoded)
  # Real value: pnl_user
  POSTGRES_USER: cG5sX3VzZXI=
  # Real value: pnl_password_change_me
  POSTGRES_PASSWORD: cG5sX3Bhc3N3b3JkX2NoYW5nZV9tZQ==

  # Database URL (base64 encoded)
  # Real value: postgresql://pnl_user:pnl_password_change_me@postgres:5432/pnl_demo
  DATABASE_URL: cG9zdGdyZXNxbDovL3BubF91c2VyOnBubF9wYXNzd29yZF9jaGFuZ2VfbWVAcG9zdGdyZXM6NTQzMi9wbmxfZGVtbw==

  # AWS credentials (base64 encoded) - use IAM roles in production
  # These are placeholders - replace with real values or use IRSA
  AWS_ACCESS_KEY_ID: QUNDRVNTX0tFWV9QTEFDSEVIT0xERVI=
  AWS_SECRET_ACCESS_KEY: U0VDUkVUX0tFWV9QTEFDSEVIT0xERVI=
---
