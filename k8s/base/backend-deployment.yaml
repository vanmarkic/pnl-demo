# Backend Deployment - FastAPI Application
#
# Learning points:
# - Deployments manage ReplicaSets and provide declarative updates
# - Rolling updates: gradual replacement of pods
# - Resource requests/limits for pod scheduling and QoS
# - Probes ensure traffic only goes to healthy pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pnl-demo
  labels:
    app: backend
    tier: api
spec:
  replicas: 2  # Run 2 instances for high availability
  selector:
    matchLabels:
      app: backend
  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Max pods over desired count during update
      maxUnavailable: 0  # Never reduce below desired count
  template:
    metadata:
      labels:
        app: backend
        tier: api
      annotations:
        # Force restart on config changes
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
    spec:
      # Init container to wait for database
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: backend
          image: pnl-backend:latest
          imagePullPolicy: IfNotPresent  # Use Always for production
          ports:
            - containerPort: 8000
              name: http
          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: pnl-config
          # Environment from Secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pnl-secrets
                  key: DATABASE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pnl-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pnl-secrets
                  key: AWS_SECRET_ACCESS_KEY
          # Resource management
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Liveness probe - restart if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - remove from service if not ready
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup probe - for slow-starting containers
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30  # 30 * 5 = 150s max startup time
      # Pod-level settings
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
