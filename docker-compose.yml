# Docker Compose - Multi-container Application
#
# Learning points:
# - Service orchestration
# - Network configuration
# - Volume mounts for development
# - Environment variables
# - Health check dependencies

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pnl-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./pnl_demo.db
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount for development (hot-reload)
      - ./backend:/app
      # Persist SQLite database
      - pnl-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pnl-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pnl-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pnl-network

  # PostgreSQL Database (optional - for production)
  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: pnl-postgres
  #   environment:
  #     - POSTGRES_USER=pnl_user
  #     - POSTGRES_PASSWORD=pnl_password
  #     - POSTGRES_DB=pnl_demo
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U pnl_user -d pnl_demo"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - pnl-network

networks:
  pnl-network:
    driver: bridge

volumes:
  pnl-data:
  # postgres-data:
